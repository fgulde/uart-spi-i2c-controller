name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + simulate + synth-check every module. This is the required,
  # fast gate — same `just ci` command as run locally.
  lint-sim-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OSS toolchain (iverilog, yosys, verilator)
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Lint + simulate + synth-check all modules
        run: just ci

  # Line/toggle coverage per module via Verilator. Separate job because
  # it needs a C++ toolchain to build the verilated model (ubuntu-latest
  # ships build-essential by default; installed explicitly below to be
  # independent of that). Not required for the lint-sim-synth gate above.
  coverage:
    runs-on: ubuntu-latest
    needs: lint-sim-synth
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (verilator + C++ build tools)
        run: sudo apt-get update && sudo apt-get install -y verilator build-essential

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Collect coverage for every module
        run: |
          set -euo pipefail
          for m in $(just --evaluate modules); do
            echo "=== coverage: $m ==="
            just coverage "$m"
          done

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_annotated/
          if-no-files-found: warn
