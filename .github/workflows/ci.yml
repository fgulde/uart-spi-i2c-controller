name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + simulate + synth-check every module — same `just ci`
  # command as run locally.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OSS toolchain (iverilog, yosys, verilator)
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Lint + simulate + synth-check all modules
        run: just ci
